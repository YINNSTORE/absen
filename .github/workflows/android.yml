name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build optimized debug APKs
        run: gradle assembleDebug --stacktrace

      - name: Inspect APK sizes
        run: |
          echo "=== APK FILES ==="
          find app/build/outputs/apk -type f -name '*.apk' -print -exec du -h {} \;

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: Absensi-MTs-Al-Basroh-v1.2.0-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
