name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle test --stacktrace --no-daemon

      - name: Build ONE Universal APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify only universal APK exists
        shell: bash
        run: |
          echo "=== APK FILES ==="
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -exec du -h {} \;
          COUNT=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 APK, found $COUNT"
            exit 1
          fi
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Absensi-MTs-Al-Basroh-universal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
