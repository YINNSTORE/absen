name: Android Build - MTs Al Basroh

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    name: Build APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Check Project
        run: |
          gradle --version
          echo "Building Absensi MTs Al Basroh..."

      - name: Clean
        run: |
          gradle clean --stacktrace

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Show APK
        run: |
          echo "======================================"
          echo "APK BERHASIL DIBUAT"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absensi-MTs-Al-Basroh-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error