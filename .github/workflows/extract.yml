name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract ZIP to Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        run: |
          echo "=== ZIP FILES ==="
          find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) -print

      - name: Extract project
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "Menggunakan ZIP: $ZIP"

          mkdir -p /tmp/project

          unzip -q "$ZIP" -d /tmp/project

          echo "=== HASIL EKSTRAK ==="
          find /tmp/project -maxdepth 4 -type f | head -200

          ROOT=$(find /tmp/project -type f -name "settings.gradle.kts" -o -name "settings.gradle" \
            | head -n 1 | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            ROOT="/tmp/project"
          fi

          echo "Project root: $ROOT"

          # Hapus isi repository kecuali .git dan workflow extraction
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Copy project ke repository
          cp -a "$ROOT"/. .

          # Jangan ikutkan workflow dari ZIP.
          # Workflow extraction ini tetap dikelola oleh repository.
          rm -f .github/workflows/android.yml 2>/dev/null || true

          echo "=== PROJECT ROOT ==="
          ls -lah

          echo "=== ANDROID PROJECT ==="
          find app -maxdepth 3 -type f | sort | head -200

      - name: Remove ZIP
        run: |
          find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) \
            ! -path "./.git/*" \
            -delete || true

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Extract new Absensi MTs-Al Basroh project"
            git push
          fi